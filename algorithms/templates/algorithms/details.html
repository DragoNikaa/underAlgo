<div class="flex-row flex-wrap medium-gap">
	<a href="{% url 'algorithms' %}?difficulty={{ algorithm.difficulty.slug }}" class="link {{ algorithm.difficulty }}">{{ algorithm.difficulty }}</a>
	{% for category in algorithm.categories.all %}
	<a href="{% url 'algorithms' %}?category={{ category.slug }}" class="link">{{ category }}</a>
	{% endfor %}
</div>
