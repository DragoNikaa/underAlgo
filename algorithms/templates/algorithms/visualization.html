{% extends "index.html" %}
{% load static %}
{% block styles %}
<link rel="stylesheet" href="{% static 'algorithms/styles/visualization.css' %}">
{% endblock styles %}
{% block content %}
<h1>{{ name }}</h1>
<div id="visualization">
	<div>
		<div id="kwargs"></div>
		<div id="variables"></div>
		<div id="result"></div>
		<button id="step-button">start</button>
	</div>
	<div id="lines">
		{% for line in code %}
		<pre id="line_{{ forloop.counter }}">{{ forloop.counter }}&#9;{{ line }}</pre>
		{% endfor %}
	</div>
</div>
{% endblock content %}
{% block scripts %}
<script src="{% static 'algorithms/scripts/visualization.js' %}"></script>
{% endblock scripts %}
